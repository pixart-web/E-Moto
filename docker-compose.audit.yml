services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: emoto_test
      MARIADB_USER: emoto_test
      MARIADB_PASSWORD: test-only-password
      MARIADB_ROOT_PASSWORD: test-only-root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - emoto_audit_db:/var/lib/mysql
      - ./tests/integration/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  app:
    build:
      context: .
      dockerfile: tests/integration/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./:/var/www/html:ro
      - emoto_audit_private:/var/www/html/private
      - ./tests/integration/config.php:/var/www/html/private/config.php:ro
      - emoto_audit_backups:/var/www/e-motogreen-backups
volumes:
  emoto_audit_db:
  emoto_audit_backups:
  emoto_audit_private:
