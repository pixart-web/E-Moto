plugins { id 'com.android.application' }

android {
    namespace 'pt.motogreen.emoto'
    compileSdk 35

    defaultConfig {
        applicationId 'pt.motogreen.emoto'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.1.1'
        buildConfigField 'String', 'PLATFORM_URL', '"https://e-moto.motogreen.pt/"'
    }

    buildFeatures { buildConfig true }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
